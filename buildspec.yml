version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20

  pre_build:
    commands:
      - echo "Install frontend dependencies"
      - cd frontend
      - npm install
      - cd ..

  build:
    commands:
      - echo "Build frontend"
      - cd frontend
      - npm run build
      - cd ..
      - echo "Build backend"
      - cd bookapp
      - chmod +x gradlew
      - ./gradlew clean build -x test
      - cd ..
      - echo "Verify build outputs"
      - test -f frontend/dist/index.html
      - ls -al frontend/dist
      - ls -al bookapp/build/libs
      - find frontend/dist bookapp/build/libs scripts -maxdepth 3 -type f | head -100

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - deploy-scripts/**/*
    - frontend/dist/**/*
    - bookapp/build/libs/*.jar
  discard-paths: no
