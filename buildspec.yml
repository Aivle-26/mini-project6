version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - cd frontend
      - npm ci

  build:
    commands:
      - npm run build

artifacts:
  base-directory: frontend/dist
  files:
    - 'dist/test-angular-projet/**/*'
    - appspec.yml
    - 'deploy-scripts/**/*'