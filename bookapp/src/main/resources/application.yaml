spring:
  application:
    name: bookapp

  datasource:
    url: ${DB_URL:jdbc:h2:file:./bookapp-data}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  security:
    oauth2:
      client:
        registration:
          google:
            # ✅ 로컬 개발 시: 여기에 직접 입력하거나 환경변수로 주입
            client-id: ${GOOGLE_CLIENT_ID:420393833930-a8hamfrn9m9ktjfuhe9m86nb6uifbmji.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile

server:
  forward-headers-strategy: framework

app:
  # ✅ 로컬 개발 시 비워두면 자동으로 요청 Host에서 감지
  # 배포 시: FRONTEND_URL=https://your-domain.com 으로 주입
  frontend-url: ${FRONTEND_URL:http://ec2-43-201-68-198.ap-northeast-2.compute.amazonaws.com/}
