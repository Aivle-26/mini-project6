version: 0.0
os: linux
file_exists_behavior: OVERWRITE

files:
  - source: frontend
    destination: /var/www/my-angular-project
  - source: bookapp/build/libs
    destination: /home/ec2-user/app/backend

hooks:
  AfterInstall:
    - location: scripts/restart_nginx.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
